<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andy's Keeping Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+IE:wght@100..400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --paper: #F5EDE1;
    --card: #FFFBF3;
    --ink: #3B2E22;
    --ink-soft: #8C7A64;
    --rose: #AE653A;
    --rose-soft: #ECDAC5;
    --ochre: #C08A3E;
    --ochre-soft: #F1E3C4;
    --green: #6E8259;
    --line: #E4D6C2;
    --shadow: rgba(59, 46, 34, 0.16);
    --backdrop: #E7DAC5;
    --font-display: 'Playwrite IE', cursive;
    --font-body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #221B14;
      --card: #2C2319;
      --ink: #F0E6D8;
      --ink-soft: #B3A188;
      --rose: #D98A54;
      --rose-soft: #4A3626;
      --ochre: #E0B15E;
      --ochre-soft: #4A3D22;
      --green: #8FA377;
      --line: #3D3123;
      --shadow: rgba(0, 0, 0, 0.5);
      --backdrop: #15100B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #221B14;
    --card: #2C2319;
    --ink: #F0E6D8;
    --ink-soft: #B3A188;
    --rose: #D98A54;
    --rose-soft: #4A3626;
    --ochre: #E0B15E;
    --ochre-soft: #4A3D22;
    --green: #8FA377;
    --line: #3D3123;
    --shadow: rgba(0, 0, 0, 0.5);
    --backdrop: #16130E;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 18px 100px;
    min-height: 100%;
    position: relative;
  }

  @media (min-width: 720px) {
    #app {
      max-width: 820px;
      min-height: 0;
      margin: 32px auto;
      padding: 20px 24px 100px;
    }
    .day-grid, .weekday-row { gap: 12px; }
  }

  .banner {
    display: none;
    background: var(--ochre-soft);
    color: var(--ink);
    border: 1px solid var(--ochre);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.88rem;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .banner.show { display: block; }

  /* ---------- Header ---------- */
  .topbar { margin-bottom: 6px; }
  .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .brand-avatar {
    border: none; background: none; padding: 0; margin: 0;
    display: flex; align-items: center; cursor: pointer; flex-shrink: 0;
    -webkit-appearance: none; appearance: none;
  }
  .brand-avatar:focus { outline: none; }
  .brand-avatar img { height: 60px; width: auto; display: block; }
  .brand-title {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.75rem;
    line-height: 1.2;
    margin: 0;
  }
  .topbar-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .view-toggle {
    display: flex;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .toggle-btn {
    border: none;
    background: transparent;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .toggle-btn.active { background: var(--rose); color: #fff; }

  .icon-btn {
    border: 1px solid var(--line);
    background: var(--card);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    flex-shrink: 0;
  }
  .icon-btn svg { width: 16px; height: 16px; }

  .month-nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 6px;
    margin: 22px 0 14px;
  }
  .month-label {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.3rem;
    text-align: center;
    white-space: nowrap;
    padding: 0 4px;
  }
  .month-side {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    opacity: 0.5;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.78rem;
    padding: 8px 2px;
    min-width: 0;
  }
  .month-side:hover, .month-side:focus-visible { opacity: 0.9; }
  .month-side.prev { justify-content: flex-start; }
  .month-side.next { justify-content: flex-end; text-align: right; }
  .month-side span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .month-side svg { width: 13px; height: 13px; flex-shrink: 0; }
  /* ---------- Calendar ---------- */
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .weekday { text-align: center; font-size: 0.72rem; font-weight: 700; color: var(--ink-soft); }
  .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .day-cell.blank { visibility: hidden; cursor: default; }
  .day-cell.today { border: 2px solid var(--rose); }
  .day-cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .day-cell.no-image-published { background: var(--rose-soft); }
  .day-number {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--ink-soft);
    z-index: 1;
  }
  .day-cell.no-image-published .day-number { color: var(--rose); }
  .draft-dot {
    position: absolute;
    bottom: 5px; right: 5px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ochre);
  }

  /* ---------- Cards view ---------- */
  .month-divider {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.05rem;
    color: var(--ink-soft);
    margin: 22px 4px 10px;
  }
  .month-divider:first-child { margin-top: 4px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 18px;
    cursor: pointer;
    position: relative;
  }
  .card-draft-tag {
    position: absolute;
    top: 10px; left: 10px;
    background: var(--ochre);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    z-index: 2;
    letter-spacing: 0.02em;
  }
  .card-image { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--rose-soft); }
  .card-image-placeholder {
    width: 100%; aspect-ratio: 4 / 3; background: var(--rose-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 2.4rem; color: var(--rose);
  }
  .card-body { padding: 14px 18px 20px; text-align: center; }
  .card-date { font-family: var(--font-display); font-weight: 400; font-size: 1rem; color: var(--ink-soft); margin: 0; }
  .card-title { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; margin: 2px 0 0; line-height: 1.2; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state p { font-size: 0.95rem; line-height: 1.6; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 22px;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--rose);
    color: #fff;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 20;
  }
  .fab svg { width: 24px; height: 24px; }

  @media (min-width: 720px) {
    .fab { right: calc(50vw - 410px + 24px); }
  }

  /* ---------- Overlay ---------- */
  .overlay { display: none; position: fixed; inset: 0; z-index: 50; }
  .overlay.open { display: block; }
  .overlay-backdrop { display: none; }
  .overlay-card {
    position: absolute; inset: 0;
    background: var(--paper);
    overflow-y: auto;
    padding: 20px 20px calc(90px + env(safe-area-inset-bottom, 0px));
    animation: fadeIn 0.18s ease-out;
  }
  .overlay-inner { max-width: 820px; margin: 0 auto; position: relative; padding-top: 76px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay-close {
    position: fixed; top: calc(32px + env(safe-area-inset-top, 0px)); left: 20px;
    border: none; background: none; padding: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--ink-soft); z-index: 51;
  }
  .overlay-close:hover { color: var(--ink); }
  .overlay-close svg { width: 22px; height: 22px; }

  .view-image { width: 100%; max-height: 480px; object-fit: cover; border-radius: 16px; display: block; }
  .entry-img { max-width: 100%; border-radius: 14px; display: block; margin: 16px auto; }
  .view-date { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; color: var(--ink-soft); text-align: center; margin: 18px 0 0; }
  .view-title { font-family: var(--font-display); font-weight: 400; font-size: 1.75rem; text-align: center; margin: 2px 0 14px; }
  .view-text { font-size: 1.08rem; line-height: 1.75; margin: 0 0 20px; }
  .view-text p { margin: 0 0 12px; }
  .view-text p:last-child { margin-bottom: 0; }
  .view-text blockquote, .rich-editor blockquote {
    margin: 8px 0; padding: 2px 0 2px 14px;
    border-left: 3px solid var(--rose);
    color: var(--ink-soft); font-style: italic;
  }
  .view-actions { display: flex; gap: 10px; justify-content: center; }

  .like-btn {
    position: fixed;
    right: 22px;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 16px 5px 5px; cursor: pointer;
    font-family: var(--font-body); font-weight: 700; font-size: 0.95rem; color: var(--ink);
    z-index: 51;
  }
  .like-btn img { width: 32px; height: 32px; display: block; }
  .like-btn.pop img { animation: likePop 0.4s ease; }
  @keyframes likePop {
    0% { transform: scale(1); }
    45% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  .btn {
    font-family: var(--font-body); font-weight: 700; font-size: 0.88rem;
    border-radius: 999px; padding: 10px 22px; border: none; cursor: pointer;
  }
  .btn-primary { background: var(--rose); color: #fff; }
  .btn-ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn-block { width: 100%; }
  .btn-danger-link {
    display: block; margin: 14px auto 0; background: none; border: none;
    color: var(--ink-soft); font-size: 0.8rem; text-decoration: underline; cursor: pointer;
  }

  .field { margin: 26px 0 16px; }
  .field label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .field input[type="text"] {
    width: 100%; border: none; border-bottom: 2px solid var(--line); background: transparent;
    font-family: var(--font-body); font-size: 1rem; color: var(--ink); padding: 6px 2px;
  }
  .field input[type="text"]:focus { outline: none; border-bottom-color: var(--rose); }

  .editor-toolbar {
    display: flex; gap: 8px; margin-bottom: 8px;
    position: sticky; top: 70px; z-index: 6;
    background: var(--paper); padding: 6px 0;
  }
  .editor-toolbar button {
    width: 36px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-family: var(--font-body); font-size: 0.95rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .editor-toolbar button.active { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); }

  .rich-editor {
    width: 100%; min-height: 120px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card);
    font-family: var(--font-body); font-size: 1.08rem; line-height: 1.7; color: var(--ink);
    padding: 10px 12px;
  }
  .rich-editor:focus { outline: none; border-color: var(--rose); }
  .rich-editor:empty:before { content: attr(data-placeholder); color: var(--ink-soft); }
  .rich-editor p { margin: 0 0 10px; }
  .rich-editor p:last-child, .rich-editor div:last-child { margin-bottom: 0; }

  .edit-date-label { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--ink-soft); text-align: center; margin-top: 0; }

  .image-zone {
    margin-top: 14px; border-radius: 16px; overflow: hidden; position: relative;
    background: var(--card); border: 1.5px dashed var(--line);
  }
  .image-zone.has-image { border-style: solid; border-color: var(--line); }
  .image-zone img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .image-zone-empty { padding: 34px 10px; text-align: center; color: var(--ink-soft); font-size: 0.88rem; cursor: pointer; }
  .image-zone-empty svg { width: 26px; height: 26px; margin-bottom: 8px; }
  .image-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
  .image-actions button {
    background: none; border: none; color: var(--rose);
    font-family: var(--font-body); font-weight: 700; font-size: 0.8rem; cursor: pointer; text-decoration: underline;
  }
  .image-uploading-overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,0.6);
    display: none; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; color: var(--ink);
  }
  .image-uploading-overlay.show { display: flex; }

  .form-message { font-size: 0.82rem; color: var(--rose); text-align: center; min-height: 18px; margin-top: 10px; }

  .edit-actions { display: flex; gap: 10px; margin-top: 6px; }
  .edit-actions .btn { flex: 1; }

  .draft-flag { text-align: center; font-size: 0.78rem; color: var(--ochre); font-weight: 700; margin-top: -8px; }

  .settings-title { font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; text-align: center; margin-top: 26px; }
  .settings-desc { font-size: 0.88rem; color: var(--ink-soft); text-align: center; line-height: 1.6; margin: 8px 0 22px; }

  input[type="file"] { display: none; }
</style>
</head>

  var FLOWER_IMG = '<img src="' + FLOWER_ICON_SRC + '" alt="hoa cúc">';

  var state = {
    view: 'calendar',
    monthCursor: new Date(),
    entries: {},
    likes: {},
    idb: null,
    db: null,
    assetsApi: null,
    userApi: null,
    canEdit: false,
    selectedDate: null,
    editing: { currentImage: null }
  };

  try {
    var savedView = localStorage.getItem('artjournal_view');
    if (savedView === 'calendar' || savedView === 'cards') state.view = savedView;
  } catch (e) {}

  function pad(n){ return String(n).padStart(2,'0'); }
  function toDateStr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function todayStr(){ return toDateStr(new Date()); }
  function parseDateStr(s){
    var parts = s.split('-');
    return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
  }
  function formatDisplayDate(dateStr){
    var d = parseDateStr(dateStr);
    return d.getDate() + ' ' + VN_MONTHS[d.getMonth()] + ', ' + d.getFullYear();
  }
  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function sanitizeHtml(html){
    var temp = document.createElement('div');
    temp.innerHTML = html || '';
    (function clean(node){
      var children = Array.prototype.slice.call(node.childNodes);
      children.forEach(function(child){
        if (child.nodeType === 1) {
          if (!ALLOWED_TAGS[child.tagName]) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
          } else if (child.tagName === 'IMG') {
            var src = child.getAttribute('src') || '';
            while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
            if (src.indexOf('/_blob/') === 0) {
              child.setAttribute('src', src);
              child.setAttribute('class', 'entry-img');
            } else {
              node.removeChild(child);
            }
          } else {
            while (child.attributes && child.attributes.length > 0) {
              child.removeAttribute(child.attributes[0].name);
            }
            clean(child);
          }
        } else if (child.nodeType !== 3) {
          node.removeChild(child);
        }
      });
    })(temp);
    return temp.innerHTML;
  }

  // ---------------- Banner ----------------
  var bannerEl = document.getElementById('banner');
  function showBanner(msg){ bannerEl.textContent = msg; bannerEl.classList.add('show'); }
  function hideBanner(){ bannerEl.classList.remove('show'); }

  // ---------------- IndexedDB (local, account-independent storage) ----------------
  function openIdb(){
    return new Promise(function(resolve, reject){
      if (!window.indexedDB) { reject(new Error('no-indexeddb')); return; }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'date' });
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbGetAll(){
    return new Promise(function(resolve, reject){
      var tx = state.idb.transaction(STORE_NAME, 'readonly');
      var req = tx.objectStore(STORE_NAME).getAll();
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }

  async function init(){
    state.entries = PUBLIC_ENTRIES || {};
    state.likes = getPublicLikes();
    state.canEdit = false;
    applyRoleUI();
    renderAll();
  }

  function applyRoleUI(){
    var fab = document.getElementById('fabAdd');
    var settingsBtn = document.getElementById('btnSettings');
    if (fab) fab.style.display = state.canEdit ? '' : 'none';
    if (settingsBtn) settingsBtn.style.display = state.canEdit ? '' : 'none';
  }

  function subscribeEntries(){
    var q = state.db.collection('entries').orderBy('date', 'desc').limit(1000);
    q.onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ if (d.exists) map[d.id] = d.data(); });
      state.entries = map;
      renderAll();
    }, function(err){
      showBanner('Mất kết nối bộ nhớ, đang thử khôi phục...');
    });
  }

  function subscribeLikes(){
    var q = state.db.collection('likes').limit(1000);
    q.onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ if (d.exists) map[d.id] = (d.data().count || 0); });
      state.likes = map;
      var countEl = document.getElementById('likeCount');
      if (countEl && state.selectedDate && map[state.selectedDate] !== undefined) {
        countEl.textContent = map[state.selectedDate];
      }
    }, function(err){});
  }

  async function migrateFromLocalIfNeeded(){
    if (!state.canEdit || !state.assetsApi) return;
    try {
      var idb = await openIdb();
      state.idb = idb;
      var localEntries = await idbGetAll();
      if (!localEntries || localEntries.length === 0) return;
      var snap = await state.db.collection('entries').limit(1).get();
      if (!snap.empty) return;
      if (!window.confirm('Tìm thấy ' + localEntries.length + ' bài viết cũ lưu trên trình duyệt này. Chuyển lên bộ nhớ chia sẻ để mọi người đọc được không?')) return;
      for (var i = 0; i < localEntries.length; i++) {
        var e = localEntries[i];
        var payload = {
          date: e.date, title: e.title || '', text: e.text || '',
          status: e.status || 'draft', updatedAt: e.updatedAt || new Date().toISOString(),
          image: null
        };
        if (e.image && e.image.indexOf('data:image/') === 0) {
          var blob = await (await fetch(e.image)).blob();
          var res = await state.assetsApi.upload(blob, { type: blob.type });
          payload.image = res.url;
        }
        payload.text = await migrateInlineImages(payload.text);
        await state.db.doc('entries/' + payload.date).set(payload);
      }

  function insertImageIntoEditor(editorEl, dataUrl, range){
    editorEl.focus();
    var img = document.createElement('img');
    img.src = dataUrl;
    img.className = 'entry-img';
    var br = document.createElement('br');

    var sel = window.getSelection();
    if (range && editorEl.contains(range.startContainer)) {
      sel.removeAllRanges();
      sel.addRange(range);
    }
    if (sel.rangeCount && editorEl.contains(sel.anchorNode)) {
      var r = sel.getRangeAt(0);
      r.deleteContents();
      r.insertNode(br);
      r.insertNode(img);
      r.setStartAfter(br);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
    } else {
      editorEl.appendChild(img);
      editorEl.appendChild(br);
    }
  }

  function isSelectionInsideQuote(editorEl){
    var sel = window.getSelection();
    if (!sel.rangeCount) return false;
    var node = sel.anchorNode;
    while (node && node !== editorEl) {
      if (node.nodeType === 1 && node.tagName === 'BLOCKQUOTE') return true;
      node = node.parentNode;
    }
    return false;
  }

  function resizeImageToDataUrl(file, maxDim){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          var scale = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var outType = (file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/gif') ? file.type : 'image/jpeg';
        var dataUrl = canvas.toDataURL(outType, 0.85);
        URL.revokeObjectURL(url);
        resolve(dataUrl);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image-load-failed')); };
      img.src = url;
    });
  }

  function resizeImageToBlob(file, maxDim){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          var scale = Math.min(maxDim/w, maxDim/h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var outType = (file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/gif') ? file.type : 'image/jpeg';
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(url);
          if (blob) resolve({ blob: blob, type: outType });
          else reject(new Error('canvas-empty'));
        }, outType, 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image-load-failed')); };
      img.src = url;
    });
  }

  async function saveEntry(dateStr, status){
    if (!state.canEdit) { setFormMessage('Bạn không có quyền chỉnh sửa.'); return; }
    var titleVal = document.getElementById('titleInput').value.trim();
    var editorEl = document.getElementById('textInput');
    var textHtml = sanitizeHtml(editorEl.innerHTML);
    var textPlain = editorEl.textContent.trim();

    if (status === 'published' && !titleVal && !textPlain && !state.editing.currentImage) {
      setFormMessage('Thêm tiêu đề, vài dòng hoặc một tấm ảnh trước khi đăng nhé.');
      return;
    }

    var payload = {
      date: dateStr,
      title: titleVal,
      text: textHtml,
      image: state.editing.currentImage || null,
      status: status,
      updatedAt: new Date().toISOString()
    };

    setFormMessage('Đang lưu...');
    try {
      await state.db.doc('entries/' + dateStr).set(payload);
      var oldImg = state.editing.previousImage;
      var newImg = state.editing.currentImage;
      if (oldImg && oldImg !== newImg && state.assetsApi) {
        state.assetsApi.delete(oldImg).catch(function(){});
      }
      state.entries[dateStr] = payload;
      renderAll();
      closeOverlay();
    } catch (e) {
      setFormMessage('Không lưu được, thử lại nhé.');
    }
  }

    try {

      await state.db.doc('entries/' + dateStr).delete();
      if (entry && entry.image && state.assetsApi) {
        state.assetsApi.delete(entry.image).catch(function(){});
      }
      delete state.entries[dateStr];
      renderAll();
      closeOverlay();
    } catch (e) {
      setFormMessage('Không xoá được, thử lại nhé.');
    }
  }

    document.getElementById('ovClose').addEventListener('click', closeOverlay);
    document.getElementById('btnExport').addEventListener('click', exportData);
    document.getElementById('btnImportTrigger').addEventListener('click', function(){
      document.getElementById('importFile').click();
    });
    document.getElementById('importFile').addEventListener('change', function(e){
      if (e.target.files && e.target.files[0]) importDataFile(e.target.files[0]);
    });
    overlay.classList.add('open');
  }
  document.getElementById('btnSettings').addEventListener('click', openSettings);

  function exportData(){
    var payload = { exportedAt: new Date().toISOString(), entries: Object.values(state.entries) };
    var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'andys-keeping-room-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  async function importDataFile(file){
    if (!state.canEdit) { setFormMessage('Bạn không có quyền nhập dữ liệu.'); return; }
    try {
      var text = await file.text();
      var payload = JSON.parse(text);
      var list = Array.isArray(payload.entries) ? payload.entries : (Array.isArray(payload) ? payload : null);
      if (!list) throw new Error('bad-format');
      var valid = list.filter(function(r){ return r && typeof r.date === 'string'; });
      if (!window.confirm('Nhập ' + valid.length + ' mục nhật ký? Ngày trùng sẽ được ghi đè.')) return;
      setFormMessage('Đang nhập...');
      for (var i = 0; i < valid.length; i++) {
        var e = valid[i];
        var entryPayload = {
          date: e.date, title: e.title || '', text: e.text || '',
          status: e.status || 'draft', updatedAt: e.updatedAt || new Date().toISOString(),
          image: null
        };
        if (e.image) {
          if (e.image.indexOf('data:image/') === 0 && state.assetsApi) {
            var blob = await (await fetch(e.image)).blob();
            var res = await state.assetsApi.upload(blob, { type: blob.type });
            entryPayload.image = res.url;
          } else {
            entryPayload.image = e.image;
          }
        }
        entryPayload.text = await migrateInlineImages(entryPayload.text);
        await state.db.doc('entries/' + entryPayload.date).set(entryPayload);
        state.entries[entryPayload.date] = entryPayload;
      }
      renderAll();
      setFormMessage('Đã nhập xong ' + valid.length + ' mục.');
    } catch (e) {
      setFormMessage('File không hợp lệ hoặc bị lỗi.');
    }
  }

  // ---------------- Header avatar (small logo/photo, stored locally) ----------------
  var AVATAR_KEY = 'artjournal_avatar';
  function setAvatarPreview(dataUrl){
    document.getElementById('brandAvatarImg').src = dataUrl;
  }
  function loadAvatar(){
    try {
      var saved = localStorage.getItem(AVATAR_KEY);
      if (saved) setAvatarPreview(saved);
    } catch (e){}
  }
  document.getElementById('brandAvatarBtn').addEventListener('click', function(){
    document.getElementById('avatarFileInput').click();
  });
  document.getElementById('avatarFileInput').addEventListener('change', async function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      var dataUrl = await resizeImageToDataUrl(file, 300);
      localStorage.setItem(AVATAR_KEY, dataUrl);
      setAvatarPreview(dataUrl);
    } catch (err) {
      showBanner('Không đọc được ảnh này.');
    }
  });

  // ---------------- Init ----------------
  updateViewUI();
  renderCalendar();
  renderCards();
  loadAvatar();
  init();

})();
</script>
</body>
</html>
